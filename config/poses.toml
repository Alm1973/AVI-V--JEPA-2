# Re-teach with `./runHome teach`, then `./runHome pull`, then regenerate this.
#
# These replace a hand-written table invented from geometry nobody had
# measured, whose TALL and LOW both leaned the arm down.
#
# Degrees are logical, 0..180, as config/joints.toml defines them.
#
# DIRECTIONS, read off this data rather than inferred:
#   HIGHER wrist degrees tilt the camera UP.  REST, described as camera-down,
#   is wrist 30.5; TALL, alert, is 176. An earlier reading of a two-position
#   sweep concluded the opposite and was wrong.
#   LOWER shoulder degrees RAISE the arm.  ATTENTIVE, raised and alert, is
#   29.5; REST and LOW, folded, are 150 and 154.
#
# Note that TALL and HOME sit at almost the same shoulder angle (78.4 vs 72.5)
# and differ mainly in the wrist, 176 against 87.5. Alertness here is carried
# by where the camera looks rather than by how tall the arm stands, which fits
# an arm whose shoulder has little usable travel and whose camera is the
# expressive end.

