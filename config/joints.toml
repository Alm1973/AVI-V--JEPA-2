# Joint calibration and limits.
#
# The host works in DEGREES, 0..180, with 90 = the bench-calibrated center.
# The firmware converts degrees to PCA9685 counts with a PIECEWISE map, because
# the calibrated center is not the midpoint of the calibrated range:
#
#     angle <= 90 : count = lerp(min_count,    center_count, angle / 90)
#     angle >  90 : count = lerp(center_count, max_count,   (angle - 90) / 90)
#
# So 0 deg is exactly min_count and 180 deg is exactly max_count, and a degree
# is worth a different number of counts on either side of center. This is the
# convention BUILD_SPEC section 6.4 calls "a piecewise angle->pulse mapping
# around the calibrated center".
#
# ASSUMPTION TO VERIFY (flagged for Shaurya): the existing sketch
# firmware/servo_controller/sketch_jul1a.ino lives on the MSI, not here, so the
# exact breakpoints of its map have not been read back. If its map differs,
# firmware v2 is the authority and this file travels with it, so nothing
# downstream has to change.
#
# Counts are from Shaurya's own bench calibration (BUILD_SPEC section 3), and
# he supplied the physical meaning of each endpoint on 2026-10-05:
#
#   ch0 base      75 = far LEFT,  460 = far RIGHT
#   ch1 shoulder  75 = front/down, 370 ~ UPRIGHT, 580 = back/down
#   ch2 elbow     80..570, centre 430   (calibrated individually)
#   ch3 wrist     140..580, centre 380  (calibrated individually)
#
# These replaced an earlier global 75-580 map for every servo, which was wrong
# because the servos do not share a range. The base figures specifically fixed
# a tracking oscillation. He also replaced a failed PCA9685 at one point, so
# the board in use now is the second one.
#
# TWO THINGS THESE FACTS DO NOT SETTLE, both recorded here rather than guessed:
#
# 1. BASE DIRECTION IS AMBIGUOUS, AND THE TWO SOURCES DISAGREE.
#    By the table, count 460 = far right, so rising counts = rightward, which
#    is sign = +1. But driving the arm with sign = +1, Shaurya reported A and D
#    reversed, which implies sign = -1 (what is set below). The likely cause is
#    that "right" means different things in the two observations: the arm's own
#    right versus the direction the scene slides in a wrist-mounted camera's
#    picture, which are opposite. His hands-on report wins for how the keys
#    feel, and that is what is set -- but LookAt is a feedback loop and will
#    diverge rather than settle if this is backwards, so it must be checked
#    against a real tracked person before M3 relies on it.
#
# 2. THE SHOULDER IS NOT A MONOTONIC UP/DOWN AXIS.
#    75 is front/down and 580 is back/down, with upright in the MIDDLE. So the
#    arm is at its tallest at centre and BOTH directions lower it. The piecewise
#    map below is monotonic in counts, which is fine, but it means logical 0 and
#    logical 180 are both "down" and there is no such thing as "higher than
#    centre". The named poses in avi_bot/motion/poses.py were written assuming a
#    simple axis -- TALL above centre, LOW below -- so TALL and LOW as they
#    stand are both leaning the arm down, in opposite directions. See the note
#    in poses.py; they need re-deriving around "centre is upright".
# soft_min/soft_max are kept INSIDE the calibrated range so the host never asks
# for a mechanical end-stop; the firmware clamps to the same table independently.

[meta]
calibrated = "2026-08-04"
center_deg = 90.0
speed_cap_deg_s = 60.0      # per joint, enforced in firmware AND host-side

# What the arm can ACTUALLY do, which is not the same thing as the safety cap.
#
# MEASURED 2026-10-05 by raising the firmware cap step by step and timing a
# 60 degree sweep optically:
#
#     cap commanded   predicted   measured   implied actual
#         25 deg/s      2.40 s     3.30 s      18.2 deg/s
#         40 deg/s      1.50 s     2.69 s      22.3 deg/s
#         60 deg/s      1.00 s     2.22 s      27.1 deg/s
#         90 deg/s      0.67 s     2.24 s      26.7 deg/s
#        140 deg/s      0.43 s     2.55 s      23.6 deg/s
#
# It plateaus: above about 60 commanded, nothing gets faster, and 140 is
# slightly WORSE than 60. So roughly 27 deg/s is the ceiling, and the v1
# sketch's ~37 deg/s was far closer to the truth than the 60 this project
# assumed. The figure carries an unknown POSITIVE bias, because MJPEG buffering
# delays a frame by some tens of milliseconds, so treat 27 as a floor.
#
# Why both numbers exist: speed_cap_deg_s is a SAFETY clamp on what may be
# commanded, and 60 is fine for that since the servo simply will not achieve
# it. This number is a PHYSICAL FACT, and it is what gesture durations have to
# be derived from -- a gesture designed for 60 deg/s gets silently smeared into
# a different shape, which is worse than being refused.
achievable_deg_s = 27.0
watchdog_ms = 500           # no P frame for this long -> firmware holds position
tick_hz = 50

# --- channel 0: base yaw, look left/right -------------------------------------
[joints.base_yaw]
channel   = 0
min_count = 75
center_count = 250
max_count = 460
soft_min  = 20.0
soft_max  = 160.0
# MEASURED on hardware 2026-10-05: see the note under [joints.shoulder]. Both
# driven joints came out reversed under firmware v2's mapping.
sign      = -1
driven    = true

# --- channel 1: shoulder, whole arm up/down -----------------------------------
[joints.shoulder]
channel   = 1
min_count = 75
center_count = 370
max_count = 580
soft_min  = 25.0
soft_max  = 155.0
# MEASURED on hardware 2026-10-05: reversed, like base yaw.
#
# BOTH driven joints came out backwards from what BUILD_SPEC section 3 records
# ("+10 moves the view right", "+10 moves the view down"). Those were not wrong
# when measured -- they were measured through v1's relative X:/Y: API, which
# reaches the counts by a different route. Two independent linkages would not
# both flip, so this is one systematic difference between v1's angle->pulse
# mapping and v2's, not two coincidences. Treat every direction claim in the
# docs as v1-relative and re-measure it under v2.
#
# Shaurya found both in about a minute of driving the thing, which is the
# argument for shipping a controller he can actually hold.
sign      = -1
driven    = true
# BUG in the current firmware: channel 1 is driven with the WRIST's range
# (140/380/580) instead of the shoulder's. Fixed in avi_servo_v2.

# --- channel 2: elbow ---------------------------------------------------------
[joints.elbow]
channel   = 2
min_count = 80
center_count = 430
max_count = 570
soft_min  = 30.0
soft_max  = 150.0
sign      = 0      # UNKNOWN. 0 means "do not drive". Measure in M1, then set +-1.
driven    = false

# --- channel 3: wrist / camera tilt -------------------------------------------
[joints.wrist]
channel   = 3
min_count = 140
center_count = 380
max_count = 580
soft_min  = 30.0
soft_max  = 150.0
# Driven as of 2026-10-05, with the sign still PROVISIONAL.
#
# This is the camera's own tilt, and the camera at its calibrated centre points
# at the carpet, so leaving it pinned meant the robot could only ever look at
# the floor -- the one joint that had to work for anything else to be useful.
#
# Driving it with an unverified sign is safe even though the direction is
# unknown: the soft limits below clamp to 30..150 logical degrees, and the
# piecewise map puts that inside [min_count, max_count] whichever way the sign
# points. A wrong sign reverses R and F; it cannot reach an end stop.
sign      = 1
driven    = true

# Approximate link lengths in mm, for the sim's side view only. Eyeballed, not
# measured; they affect nothing but the drawing.
[sim]
link_shoulder_mm = 90
link_elbow_mm    = 70
link_wrist_mm    = 40
base_height_mm   = 55
