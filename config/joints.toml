# Joint calibration and limits.
#
# The host works in DEGREES, 0..180, with 90 = the bench-calibrated center.
# The firmware converts degrees to PCA9685 counts with a PIECEWISE map, because
# the calibrated center is not the midpoint of the calibrated range:
#
#     angle <= 90 : count = lerp(min_count,    center_count, angle / 90)
#     angle >  90 : count = lerp(center_count, max_count,   (angle - 90) / 90)
#
# So 0 deg is exactly min_count and 180 deg is exactly max_count, and a degree
# is worth a different number of counts on either side of center. This is the
# convention BUILD_SPEC section 6.4 calls "a piecewise angle->pulse mapping
# around the calibrated center".
#
# ASSUMPTION TO VERIFY (flagged for Shaurya): the existing sketch
# firmware/servo_controller/sketch_jul1a.ino lives on the MSI, not here, so the
# exact breakpoints of its map have not been read back. If its map differs,
# firmware v2 is the authority and this file travels with it, so nothing
# downstream has to change.
#
# Counts are from Shaurya's own bench calibration (BUILD_SPEC section 3), and
# he supplied the physical meaning of each endpoint on 2026-10-05:
#
#   ch0 base      75 = far LEFT,  460 = far RIGHT
#   ch1 shoulder  75 = front/down, 370 ~ UPRIGHT, 580 = back/down
#   ch2 elbow     80..570, centre 430   (calibrated individually)
#   ch3 wrist     140..580, centre 380  (calibrated individually)
#
# These replaced an earlier global 75-580 map for every servo, which was wrong
# because the servos do not share a range. The base figures specifically fixed
# a tracking oscillation. He also replaced a failed PCA9685 at one point, so
# the board in use now is the second one.
#
# TWO THINGS THESE FACTS DO NOT SETTLE, both recorded here rather than guessed:
#
# 1. BASE DIRECTION IS AMBIGUOUS, AND THE TWO SOURCES DISAGREE.
#    By the table, count 460 = far right, so rising counts = rightward, which
#    is sign = +1. But driving the arm with sign = +1, Shaurya reported A and D
#    reversed, which implies sign = -1 (what is set below). The likely cause is
#    that "right" means different things in the two observations: the arm's own
#    right versus the direction the scene slides in a wrist-mounted camera's
#    picture, which are opposite. His hands-on report wins for how the keys
#    feel, and that is what is set -- but LookAt is a feedback loop and will
#    diverge rather than settle if this is backwards, so it must be checked
#    against a real tracked person before M3 relies on it.
#
# 2. THE SHOULDER IS NOT A MONOTONIC UP/DOWN AXIS.
#    75 is front/down and 580 is back/down, with upright in the MIDDLE. So the
#    arm is at its tallest at centre and BOTH directions lower it. The piecewise
#    map below is monotonic in counts, which is fine, but it means logical 0 and
#    logical 180 are both "down" and there is no such thing as "higher than
#    centre". The named poses in avi_bot/motion/poses.py were written assuming a
#    simple axis -- TALL above centre, LOW below -- so TALL and LOW as they
#    stand are both leaning the arm down, in opposite directions. See the note
#    in poses.py; they need re-deriving around "centre is upright".
# soft_min/soft_max are kept INSIDE the calibrated range so the host never asks
# for a mechanical end-stop; the firmware clamps to the same table independently.

[meta]
calibrated = "2026-08-04"
center_deg = 90.0
speed_cap_deg_s = 60.0      # per joint, enforced in firmware AND host-side

# What the arm can ACTUALLY do, which is not the same thing as the safety cap.
#
# MEASURED 2026-10-05 by raising the firmware cap step by step and timing a
# 60 degree sweep optically:
#
#     cap commanded   predicted   measured   implied actual
#         25 deg/s      2.40 s     3.30 s      18.2 deg/s
#         40 deg/s      1.50 s     2.69 s      22.3 deg/s
#         60 deg/s      1.00 s     2.22 s      27.1 deg/s
#         90 deg/s      0.67 s     2.24 s      26.7 deg/s
#        140 deg/s      0.43 s     2.55 s      23.6 deg/s
#
# It plateaus: above about 60 commanded, nothing gets faster, and 140 is
# slightly WORSE than 60. So roughly 27 deg/s is the ceiling, and the v1
# sketch's ~37 deg/s was far closer to the truth than the 60 this project
# assumed. The figure carries an unknown POSITIVE bias, because MJPEG buffering
# delays a frame by some tens of milliseconds, so treat 27 as a floor.
#
# Why both numbers exist: speed_cap_deg_s is a SAFETY clamp on what may be
# commanded, and 60 is fine for that since the servo simply will not achieve
# it. This number is a PHYSICAL FACT, and it is what gesture durations have to
# be derived from -- a gesture designed for 60 deg/s gets silently smeared into
# a different shape, which is worse than being refused.
achievable_deg_s = 27.0
watchdog_ms = 500           # no P frame for this long -> firmware holds position
tick_hz = 50

# --- channel 0: base yaw, look left/right -------------------------------------
[joints.base_yaw]
channel   = 0
min_count = 75
center_count = 250
max_count = 460
soft_min  = 20.0
soft_max  = 160.0
# MEASURED on hardware 2026-10-05: see the note under [joints.shoulder]. Both
# driven joints came out reversed under firmware v2's mapping.
sign      = -1
driven    = true

# --- channel 1: shoulder, whole arm up/down -----------------------------------
[joints.shoulder]
channel   = 1
min_count = 75
center_count = 370
max_count = 580
soft_min  = 25.0
soft_max  = 155.0
# MEASURED on hardware 2026-10-05: reversed, like base yaw.
#
# BOTH driven joints came out backwards from what BUILD_SPEC section 3 records
# ("+10 moves the view right", "+10 moves the view down"). Those were not wrong
# when measured -- they were measured through v1's relative X:/Y: API, which
# reaches the counts by a different route. Two independent linkages would not
# both flip, so this is one systematic difference between v1's angle->pulse
# mapping and v2's, not two coincidences. Treat every direction claim in the
# docs as v1-relative and re-measure it under v2.
#
# Shaurya found both in about a minute of driving the thing, which is the
# argument for shipping a controller he can actually hold.
sign      = -1
driven    = true
# BUG in the current firmware: channel 1 is driven with the WRIST's range
# (140/380/580) instead of the shoulder's. Fixed in avi_servo_v2.

# --- channel 2: elbow ---------------------------------------------------------
[joints.elbow]
channel   = 2
min_count = 80
center_count = 430
max_count = 570
soft_min  = 30.0
soft_max  = 150.0
# Driven as of 2026-10-05, sign still PROVISIONAL, same reasoning as the wrist:
# the soft limits clamp to 30..150 logical degrees, which the piecewise map puts
# inside [min_count, max_count] whichever way the sign points, so a wrong sign
# reverses Q and E and cannot reach a mechanical stop. Needed so complete poses
# can be taught rather than poses with a dead joint in them.
sign      = 1
driven    = true

# --- channel 3: wrist / camera tilt -------------------------------------------
[joints.wrist]
channel   = 3
min_count = 140
center_count = 380
max_count = 580
# Widened twice on 2026-10-05, both times at Shaurya's request. The original
# 30..150 reached only counts 220..513 of the 140..580 he actually calibrated;
# 12..168 reached 172..553 and was still short. Now 4..176, reaching 151..571,
# which is nearly all of it: 9 counts clear of the bottom end and 9 of the top.
#
# Going this close is defensible because 140 and 580 are not guesses -- they are
# the endpoints he settled on by testing this servo individually, so they are
# known-reachable positions rather than mechanical stops.
#
# The margin matters more than it looks: a servo held against a mechanical stop
# stalls at maximum current, and this arm is already current-limited -- it tops
# out at 28 deg/s on a UBEC. A stall could brown out every other joint with it.
# If the wrist buzzes or binds near either end, pull these back.
#
# Which way is up: HIGHER logical degrees tilt the camera UP, so the extra
# upward travel is at the soft_MAX end. This comment said the opposite for a
# while and the earlier "measured 65 up, 115 down" was simply wrong. Three
# independent things agree on the correction:
#   - the taught poses: REST, which is asleep with the camera down, is 30.5,
#     while OBSERVE is 136 and TALL is 176;
#   - Shaurya asked for the MAX raised to 170+ specifically so it could look
#     up, which is only coherent one way round;
#   - probe_wrist, 2026-10-05: stepping the wrist 125 -> 143 moved a laptop
#     DOWN the frame 95 -> 494 px, r2 = 0.986. A landmark moving down means
#     the camera tilted up.
# Keep the two apart when writing this down: the LANDMARK moves down, the VIEW
# goes up. Conflating them is how it got stated backwards twice.
#
# soft_min RAISED 4 -> 20 on 2026-10-06, at Shaurya's request, on measurement.
# The hemisphere sweep stepped the wrist down from TALL in 6-degree-of-view
# rungs and recorded, per rung, how much the image changed from the previous
# rung (`between`) and within the rung's own clip (`within`). Down to wrist ~30
# the pattern was normal: between 13-79 px, within ~2. Below it:
#
#     wrist  25.2  between 13.6  within 1.63
#     wrist  20.5  between 13.2  within 1.61
#     wrist  15.8  between 13.6  within 2.02
#     wrist  11.1  between  3.0  within 5.11
#     wrist   6.4  between  3.9  within 6.65
#
# Under ~16 the view stops changing while the frame starts shaking: the servo
# is pushing against something mechanical and not getting there. That is a
# stall, and the paragraph above says what a stall costs on this supply. 20
# leaves margin over the last rung that clearly moved. REST, the lowest taught
# pose, is 30.5, so no pose changes.
soft_min  = 20.0
soft_max  = 176.0
# Driven as of 2026-10-05, with the sign still PROVISIONAL.
#
# This is the camera's own tilt, and the camera at its calibrated centre points
# at the carpet, so leaving it pinned meant the robot could only ever look at
# the floor -- the one joint that had to work for anything else to be useful.
#
# Driving it with an unverified sign is safe even though the direction is
# unknown: the soft limits above clamp it (20..176 logical degrees, which this
# line once described as 30..150 from an earlier pair), and the piecewise map
# puts that inside [min_count, max_count] whichever way the sign points. A wrong
# sign reverses R and F; it cannot reach an end stop.
sign      = 1
driven    = true

# Approximate link lengths in mm, for the sim's side view only. Eyeballed, not
# measured; they affect nothing but the drawing.
[sim]
link_shoulder_mm = 90
link_elbow_mm    = 70
link_wrist_mm    = 40
base_height_mm   = 55

# How far the picture moves per commanded degree. This is what closed-loop
# look-at needs, and it is NOT the camera's field of view.
#
# MEASURED 2026-10-05 by probe_axis: base_yaw stepped to five absolute
# positions, 80 -> 100 deg, moved a detected laptop 702 -> 407 px across a
# 1280 px frame. Slope -15.26 px/deg, r2 = 0.976. 1280 / 15.26 = 83.9.
#
# THIS REPLACES AN EARLIER 29.0, WHICH WAS WRONG BY A FACTOR OF 2.9, and the
# reason is worth keeping because it was not a sloppy reading -- it was a
# sound-looking measurement taken through a broken loop:
#
#   The 29.0 came from dividing a COMMANDED correction by the image shift
#   that followed it (7.4 deg -> 0.248 of a frame, 8.4 -> 0.323). Both
#   readings were taken while the loop was oscillating, which is when
#   attention.steer() was being called about 20 times per detection and the
#   arm was therefore moving far more than the single correction being
#   credited with the shift. Divide a real shift by a fraction of the motion
#   that caused it and the answer comes out small -- by very nearly the 2.9x
#   seen here. It was also measured off a PERSON, who moves; this one is
#   measured off a laptop, which does not, and with no feedback loop in the
#   path at all.
#
# Consistency check, and why 83.9 is the believable one: the C270 is about 52
# deg horizontal on a 16:9 frame, so 52 / 83.9 means base_yaw travels about
# 62% of the degrees it is commanded. The wrist, measured the same way, comes
# out at 32.2 against a ~31 deg vertical FOV, i.e. very nearly 1:1. A base
# that under-travels and a wrist that does not is physically sensible -- the
# base carries the whole arm and this arm is current-limited. 29.0 would have
# required the base to OVER-travel by 1.8x, which nothing explains.
#
# Leading explanation, NOT verified: the full mechanical sweep (counts 75..460,
# found by driving to each stop) was labelled 0..180 logical degrees, but the
# servo's real travel may be nearer 290 deg; 180/290 = 0.62. If so these are
# honest logical degrees and nothing is broken, but DO NOT reuse them as real
# angles. To settle it, measure a known real angle -- two marks a known
# distance apart at a known range -- rather than trusting the lens spec.
[camera]
yaw_deg_per_frame = 83.9   # MEASURED 2026-10-05, replaces a wrong 29.0

# The wrist's equivalent, for vertical tracking. MEASURED 2026-10-05 by
# probe_wrist: stepping the wrist across 125..143 degrees moved a detected
# laptop 95 -> 494 px down a 720 px frame, slope 22.33 px/deg, r2 = 0.986.
# 720 / 22.33 = 32.2 degrees per frame height.
#
# The 60.0 that sat here before was a guess, and it was nearly DOUBLE. With
# gain 0.45 that made the vertical loop correct 0.84 of the measured error
# every step instead of 0.45 -- still convergent, but close to hunting rather
# than slow, which is the opposite of what the guess was chosen to be safe
# against.
#
# Of the two earlier optical attempts (78 and 34), the 34 was close; both came
# from methods since shown unreliable on this scene, so neither counts as
# having got there.
#
# NOTE this one IS about the size of the camera's vertical field of view (a
# 52 deg horizontal FOV at 16:9 implies about 31 deg vertically), i.e. the
# wrist travels very nearly the degrees it is commanded. Yaw's 29 against a
# ~52 deg horizontal FOV does not. Same camera both times, so that asymmetry
# points at base_yaw UNDER-TRAVELLING its command by roughly a factor of 1.8,
# not at a narrow lens -- which is the open question just above. Treat it as a
# strong inference, not a measurement: it leans on the datasheet FOV, which
# nobody here has measured.
#
# REFUTED 2026-10-06 by POST /probe_horizon (see [horizon]). base_yaw turns
# 0.95x its command, not 0.55x. The low slide was CAMERA PITCH: a base turn
# slides the picture by cos(e) and rolls it by sin(e), and the roll, which
# needs no FOV and carries no parallax, puts the gain at 0.95. 52/83.9 = 0.62
# is cos(52 deg); the dome's 0.7492 is cos(41 deg). Backlash larger than the
# run-ups used (12-24 deg) shrank it further.
wrist_deg_per_frame = 32.2   # MEASURED 2026-10-05
wrist_measured = true

[kinematics]
# For turning joint angles into POSITIONS rather than directions. All
# UNMEASURED; every one is a ruler or protractor job, and nothing downstream
# may guess a value -- depth.py refuses rather than inventing a number.
measured = false

# Horizontal distance from the base rotation axis to the camera lens, at the
# OBSERVE shape (shoulder 84, elbow 95). This is the STEREO BASELINE: when
# base_yaw turns, the camera swings along an arc of this radius, and that arc
# is what makes depth recoverable from one camera. Metres.
camera_radius_m = 0.0

# Lens height above the desk, metres. Only needed for full 3D positions, not
# for range.
camera_height_m = 0.0

# Does the camera look OUTWARD from the base axis, or back across the desk?
# Sets the sign of the parallax term, and therefore whether a near object
# appears to move faster or slower than the far wall. +1 outward, -1 inward.
camera_faces = 0

# THE OPEN QUESTION THIS SECTION EXISTS TO SETTLE.
#
# The [camera] section above reads the yaw/wrist asymmetry -- wrist 32.2
# deg/frame against a ~31 deg vertical FOV (about 1:1), yaw 83.9 against a ~52
# deg horizontal FOV (0.62) -- as base_yaw under-travelling its command. There
# is a second explanation that fits the same numbers, and the measurement never
# distinguished them.
#
# The apparent shift rate is s = g * (1 + (r/rho) cos eta): rotation plus
# parallax. The WRIST axis passes almost through the camera, so its r is near
# zero, there is no parallax, and s = g ~ 1. The BASE axis is an arm's length
# from the camera, so r is large and the parallax term is substantial. The
# asymmetry is exactly what the geometry predicts with NO under-travel at all:
# with the camera looking back across the desk the term subtracts, and
# s = 1 - r/rho = 0.62 puts the calibration landmark at rho ~ 0.47 m, which is
# a desk distance.
#
# So `yaw_deg_per_frame = 83.9` may not be a property of the joint. It may be
# the value for whichever object was in frame on 2026-10-05, in which case it
# is wrong for everything at any other distance.
#
# THE EXPERIMENT: pan once while tracking two objects at clearly different
# distances (a mug and the far wall). Under-travel predicts both move at
# nearly the same rate; parallax predicts rates differing by tens of per cent
# -- a simulated mug at 0.45 m and wall at 4 m differ by 33%. POST /probe_depth
# runs it. Until then, treat 83.9 as a value that worked for tracking rather
# than as a measured joint constant; the closed loop converges either way,
# because it corrects whatever error it observes.

[dome]
# Degrees of camera look-direction per degree of joint command, measured by
# POST /build_dome: each joint moved alone while tracking a laptop, large steps,
# every target approached from one side, starting on TALL's shape.
#
# RE-MEASURED 2026-10-06 afternoon. The first set (base_yaw 0.6917, shoulder
# 1.1538, elbow 1.7189, wrist 1.2734) was fitted on DUPLICATED FRAMES: _frame
# handed back the same image on every call, so "the median of nine frames" was
# the median of nine copies and averaged nothing. Those numbers are void.
measured = true
measured_on = "2026-10-06"
landmark = "laptop"
frames_per_observation = 7

base_yaw = 0.7492      # r2 0.962, n 6
shoulder = 1.5426      # pitch fit r2 0.960, n 9 -- see note on shoulder/elbow
elbow    = 1.1877
wrist    = 1.0148

shoulder_sign = -1
elbow_sign    = -1
wrist_sign    = 1

# THE WRIST CROSS-VALIDATES. 31 deg vertical FOV / 1.0148 = 30.5 deg per frame,
# against 32.2 from probe_wrist on 2026-10-05 and 33.9 measured directly on
# 2026-10-06 (wrist 151.3 / 157.3 / 163.3 -> laptop cy 344 / 516 / 599). Three
# methods within ~10%. The void duplicated-frame value implied 24.3 and was the
# outlier. A gain of ~1.0 is also what the geometry predicts: the wrist axis
# passes near the camera, so it only rotates the view, and orientation adds 1:1.
#
# SHOULDER AND ELBOW ARE LOOSELY DETERMINED. Nine samples were lost to the
# laptop leaving the frame, leaving about three per pitch joint, and the two
# swapped places between runs (elbow 1.72 -> 1.19, shoulder 1.15 -> 1.54). An
# earlier note here said "elbow is 1.72 and dominates elevation"; that came from
# the void run and is RETRACTED. It matters less than it sounds: looking around
# holds shoulder and elbow at TALL's values (the pole-shape design), so only
# base_yaw and wrist enter the map, find and the sweeps -- and those two are
# the ones measured well.
#
# base_yaw 0.7492 implies yaw_deg_per_frame 52/0.7492 = 69.4, against [camera]'s
# 83.9 and three other methods that span 0.62 to 0.84. Yaw is the least settled
# constant on this arm; [camera] is left as recorded.


[horizon]
# Which way is LEVEL, measured 2026-10-06 by POST /probe_horizon with no ruler.
# At 14 wrist tilts on TALL's shape the base turned 8 deg twice and the
# pictures were registered (ORB + RANSAC similarity). A base turn about its
# axis rolls the image by g*sin(e) and slides it by g*cos(e)*px_per_deg, where
# e is the view's elevation above the plane perpendicular to the base axis.
# Fitting the ROLL across tilts (26 measurements, rms 0.066) gives level, the
# wrist's gain and the base's gain; 95% intervals from a bootstrap over tilts.
#
# Valid on TALL's shape (shoulder 78.4, elbow 88.0) only. Another shape has a
# different pitch offset; one roll measurement at it gives it.
measured = true
measured_on = "2026-10-06"
shape = "TALL"
level_wrist = 160.3   # [155.0, 164.0] -- TALL (176) looks ~16 deg ABOVE level
wrist_gain  = 1.03    # [0.93, 1.09] -- the dome's independent 1.0148 agrees
yaw_gain    = 0.95    # [0.89, 0.98] -- the 1.8x "under-travel" was pitch
# Linear convention, from slide against roll in the near-level views. Trades
# off against yaw_gain (slide = g cos(e) P), so it is no better than ~+-3 deg;
# the datasheet's 52 sits at the edge of that.
fov_deg = 48.6
# Wrist ~44 on this shape looks at the robot's own base: the picture neither
# rolls nor slides when the base turns, because the scene turns with it.
self_view_wrist = 44.0
# Looking down at the desk, things slide 0.3-0.4 deg per deg FASTER than the
# far room at level: parallax from the lens sitting off the base axis. Faster
# means the camera is in FRONT of the axis, looking outward. The ratio is
# offset / height-above-the-desk; one ruler measurement of either makes it
# metric.
camera_faces = "outward"
# MEASURED by Shaurya with a ruler, 2026-10-08, at TALL: the lens is 25.0 cm
# straight across (level) from the base shaft's centre and 34.4 cm above the
# desk -> 25.0 / 34.4 = 0.727. The parallax figure above (0.35) treated the
# lens-to-point distance as the lens HEIGHT; the desk points it used were
# ~2 heights away horizontally, which halves the apparent offset.
offset_over_height = 0.727
# THE ONE RULER NUMBER. Lens height above the desk surface at TALL, metres.
# MEASURED 2026-10-08: 34.4 cm. The prior from the laptop screen's apparent
# size (~0.3 m) agreed to within its own range.
lens_height_m = 0.344

[body]
# AVI's 3D self-model (avi_bot/motion/body.py). Lengths are PRIORS, not
# measured: the fit anchors them to the [horizon] ruler numbers at TALL.
measured = false
base_height_m = 0.10
upper_arm_m = 0.15
lens_m = 0.06
upright = 90.0
# MEASURED 2026-10-09 ~08:05 by POST /babble at ATTENTIVE (32 single-joint
# moves of 3-6 deg, out and back, daylight), as picture slide per degree,
# ORB / V-JEPA:  base_yaw -21.8 / -29.1   shoulder -19.4 / -23.6
#                elbow    -14.9 / -20.3   wrist    +19.8 / +25.6  px/deg
# The two judges differ in scale by ~25% (JEPA's token shift is coarse) but
# agree on RATIOS. Against the wrist (gain 1.03, [horizon]): shoulder 0.98
# and 0.92 of it, elbow 0.75 and 0.79. So shoulder ~1.0 (as assumed) and the
# elbow turns the view ~0.79 deg per deg.
shoulder_gain = 1.0
elbow_gain = 0.79
# The model's shoulder/elbow DIRECTION was right on 15/16 moves by ORB and
# 12/13 by V-JEPA (the one miss each was also missed by the learned slopes:
# a move the camera barely saw). The old rule predicted none of them. So the
# move judge now uses shoulder and elbow too.
reach_judged = true
